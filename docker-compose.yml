services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: productos
      POSTGRES_PASSWORD: productos
      POSTGRES_DB: productos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - productos-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - productos-net

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./.claude-credentials.json:/root/.claude/.credentials.json:ro
      - ${CLAUDEGRAPH_PATH:-../../__PERSO__/claudegraph}:/claudegraph:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://productos:productos@postgres:5432/productos?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - productos-net

volumes:
  pgdata:

networks:
  productos-net:
    driver: bridge
